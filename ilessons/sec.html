<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة داخل لوحة التحكم وأمن الحاسوب</title>
<style>
:root{--bg:#f7f4ee;--card:#fffdf9;--tx:#2a2622;--mut:#6f675d;--pri:#1f5c4d;--acc:#b5532a;--ok:#2f7d4f;--bad:#b3392f;--bd:#e3dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1814;--card:#24211c;--tx:#efe9df;--mut:#b2a99a;--pri:#6fb59f;--bd:#3a352d}}
:root[data-theme="dark"]{--bg:#1a1814;--card:#24211c;--tx:#efe9df;--mut:#b2a99a;--pri:#6fb59f;--bd:#3a352d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8}
header{max-width:760px;margin:auto;padding:22px 14px 10px;border-bottom:1px solid var(--bd)}
h1{margin:0;font-size:clamp(1.3rem,4.5vw,1.8rem)}
.pts{color:var(--mut)}.pts b{color:var(--acc)}
main{max-width:760px;margin:auto;padding:8px 14px 40px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .6s}
.pc{font-size:.85rem;color:var(--mut);margin:4px 0}
.steps{display:flex;gap:6px;margin:12px 0}
.st{flex:1;font:inherit;font-size:.82rem;padding:8px 4px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer}
.st.cur{border:2px solid var(--pri);color:var(--tx);font-weight:700}
.st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.st.lock{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:24px;min-height:290px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.tag{display:inline-block;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:0 10px;font-size:.85rem}
.panel h2{margin:10px 0 6px}.panel p{font-size:1.06rem;margin:6px 0}
.dots{display:flex;gap:5px;justify-content:center;margin:14px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--pri)}.dots i.cur{background:var(--acc)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{font:inherit;border:0;border-radius:6px;padding:10px 22px;background:var(--pri);color:#fff;cursor:pointer}
.btn.g{background:var(--bd);color:var(--tx)}.btn[disabled]{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--pri)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{text-align:center}.big h2{font-size:1.5rem}
.fb{min-height:1.6em;font-weight:700;margin-top:6px}
.ex{background:var(--bg);border-inline-start:4px solid var(--acc);border-radius:4px;padding:12px;margin:10px 0;font-size:.98rem}
.ex .t{color:var(--mut);font-size:.85rem;margin:4px 0}
.chips span{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:2px 12px;margin:3px;font-weight:700}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.flow b{background:var(--pri);color:#fff;border-radius:6px;padding:4px 12px;font-size:.9rem}
.bits{display:flex;gap:6px;direction:ltr;margin:8px 0}
.bits span{width:36px;height:44px;border:1px solid var(--pri);border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 1.2rem monospace;cursor:pointer;background:var(--card)}
.cvr{display:flex;gap:6px;flex-wrap:wrap;direction:ltr;margin-top:6px}
.cvr input,.cvr select,.inp{font:inherit;padding:6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx)}
.cvr input{width:100px}.inp{width:170px;direction:ltr}
.case{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.slot{border:1px dashed var(--bd);border-radius:6px;min-height:68px;padding:6px;text-align:center;font-size:.85rem;display:flex;flex-direction:column;justify-content:center;color:var(--mut)}
.slot.f{border:1px solid var(--ok);color:var(--tx);background:var(--bg)}.slot small{color:var(--mut)}

.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
@media(max-width:600px){
header{padding:16px 12px 9px} main{padding:8px 10px 28px}
.steps{flex-wrap:wrap}.st{flex:1 1 calc(50% - 6px);min-width:0;min-height:44px}
.panel{padding:16px;min-height:240px}.row{flex-wrap:wrap}
.row .btn{flex:1 1 120px;min-height:44px;padding:10px 14px}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.opt{min-height:46px}
}
@media(max-width:360px){.st{flex-basis:100%}.panel{padding:13px}.g3{grid-template-columns:1fr}}
.complete-mark{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;background:var(--ok);color:#fff;font-size:1.35rem;animation:completePop .38s ease-out}
@keyframes completePop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.panel.completed{animation:completePulse .55s ease-out}
@keyframes completePulse{0%{box-shadow:0 0 0 0 rgba(47,125,79,.28)}100%{box-shadow:0 0 0 10px transparent}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

var S={lv:0,it:0,stage:'learn',ai:0,as:0,w:0,qi:0,sc:0,max:0,done:{},seen:{},pts:0};
var KEY='security-progress-v2';
try{var sv=(function(){try{return JSON.parse(atob(location.hash.slice(1)))}catch(e){}return parent===window?JSON.parse(localStorage.getItem(KEY)||'null'):null})();if(sv){S.max=sv.max||0;S.done=sv.done||{};S.pts=sv.pts||0;S.lv=Math.min(S.max,L.length-1)}}catch(e){}
function save(){var o={max:S.max,done:S.done,pts:S.pts};try{if(parent!==window)parent.postMessage({t:'prog',u:KEY,s:o},'*');else localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}}
function addPts(n){if(!S.done[S.lv]){S.pts+=n;$('pts').textContent=S.pts}}
function reset(){S.it=0;S.qi=0;S.sc=0;S.ai=0;S.as=0;S.w=0;S.stage=L[S.lv].items.length?'learn':'quiz'}
function renderTop(){
 var n=Object.keys(S.done).length;
 $('bar').style.width=(n/L.length*100)+'%';$('pc').textContent='أنهيت '+n+' من '+L.length+' مستويات';$('pts').textContent=S.pts;
 var h='';L.forEach(function(l,i){var c=S.done[i]?'done':i===S.lv?'cur':i>S.max?'lock':'';
  h+='<button class="st '+c+'" data-i="'+i+'">'+(i+1)+'. '+l.n+(S.done[i]?' ✓':'')+'</button>'});
 $('steps').innerHTML=h}
$('steps').onclick=function(e){var i=e.target.dataset&&e.target.dataset.i;if(i===undefined||+i>S.max)return;S.lv=+i;reset();draw()};
function toQuiz(){S.stage='quiz';S.qi=0;S.sc=0;draw()}
function draw(){
 renderTop();var P=$('panel');P.style.animation='none';P.offsetHeight;P.style.animation='';
 if(S.stage==='learn')learn();else if(S.stage==='act')sortAct();else quiz()}
function learn(){
 var l=L[S.lv],it=l.items[S.it],P=$('panel'),h='<span class="tag">'+it[0]+'</span><h2>'+it[1]+'</h2><p>'+it[2]+'</p>'+(it[3]?'<div class="ex">'+it[3]+'</div>':'')+'<div class="dots">';
 l.items.forEach(function(x,i){h+='<i class="'+(i===S.it?'cur':i<S.it?'on':'')+'"></i>'});
 var last=S.it===l.items.length-1;
 h+='</div><div class="pc" style="text-align:center">'+(S.it+1)+' من '+l.items.length+'</div><div class="row"><button class="btn g" id="pv"'+(S.it?'':' disabled')+'>السابق</button><button class="btn" id="nx">'+(!last?'فهمت، التالي':l.act?'انتقل إلى التطبيق':'ابدأ اختبار المستوى')+'</button></div>';
 P.innerHTML=h;
 var k=S.lv+'-'+S.it;if(!S.seen[k]){S.seen[k]=1;addPts(1)}
 $('pv').onclick=function(){S.it--;draw()};
 $('nx').onclick=function(){if(!last){S.it++;draw()}else if(l.act){S.stage='act';S.ai=0;S.as=0;S.w=0;draw()}else toQuiz()}}
function fin(msg){$('panel').innerHTML='<div class="big"><span class="tag">انتهى التطبيق</span><h2>أحسنت</h2><p>'+msg+'</p><div class="row" style="justify-content:center"><button class="btn" id="tq">ابدأ اختبار المستوى</button></div></div>';$('tq').onclick=toQuiz}
function sortAct(){
 var l=L[S.lv],D=l.sd,P=$('panel');
 if(S.ai>=D.length)return fin(l.fm.replace('{s}',S.as).replace('{n}',D.length));
 var d=D[S.ai];
 P.innerHTML='<span class="tag">'+l.tl+' ('+(S.ai+1)+' من '+D.length+')</span><h2 style="font-size:1.2rem">'+d[0]+'</h2><div class="g3" id="g"></div><div class="fb" id="fb"></div>';
 l.sc.forEach(function(c,k){var b=document.createElement('button');b.className='opt';b.style.textAlign='center';b.textContent=c;
  b.onclick=function(){if(k===d[2]){if(!S.w){S.as++;addPts(1)}S.w=0;S.ai++;sortAct()}else{S.w=1;$('fb').textContent='ليس هذا الاختيار، جرب مرة أخرى'}};$('g').appendChild(b)})}
function quiz(){
 var l=L[S.lv],q=l.q[S.qi],P=$('panel');
 if(!q){var need=l.q.length-1,ok=S.sc>=need,last=S.lv===L.length-1;
  if(ok){var first=!S.done[S.lv];S.done[S.lv]=1;if(first){S.pts+=5}if(S.max<L.length-1&&S.max===S.lv)S.max++;save();renderTop()}
  P.classList.toggle('completed',ok);P.innerHTML='<div class="big">'+(ok?'<div class="complete-mark" aria-hidden="true">✓</div>':'')+'<h2>'+(ok?(last?'أحسنت، أكملت الرحلة':'أحسنت، أنهيت المستوى '+(S.lv+1)):'اقتربت من النجاح')+'</h2><p>نتيجتك: '+S.sc+' من '+l.q.length+'</p><p>'+(ok?(last?'مجموع نقاطك: '+S.pts+'. صرت تعرف لوحة التحكم وكيف تحمي حاسوبك.':'تم فتح المستوى التالي: '+L[S.lv+1].n):'تحتاج '+need+' إجابات صحيحة على الأقل. راجع الدرس ثم أعد المحاولة.')+'</p><div class="row" style="justify-content:center">'+(ok&&!last?'<button class="btn" id="go">المستوى التالي</button>':'')+(ok?'':'<button class="btn g" id="rv">مراجعة الدرس</button>')+'<button class="btn g" id="rt">إعادة الاختبار</button></div></div>';
  if($('go'))$('go').onclick=function(){S.lv++;reset();draw()};
  if($('rv'))$('rv').onclick=function(){S.it=0;S.stage='learn';draw()};
  $('rt').onclick=function(){S.qi=0;S.sc=0;draw()};return}
 P.innerHTML='<span class="tag">اختبار المستوى</span><p><b>السؤال '+(S.qi+1)+' من '+l.q.length+'</b></p><h2 style="font-size:1.15rem">'+q[0]+'</h2><div id="os"></div><div class="fb" id="fb"></div>';
 sh([0,1,2]).forEach(function(i){var b=document.createElement('button');b.className='opt';b.textContent=q[1][i];
  b.onclick=function(){var all=$('os').children;
   for(var j=0;j<all.length;j++){all[j].disabled=true;if(all[j].textContent===q[1][q[2]])all[j].classList.add('ok')}
   if(i===q[2]){S.sc++;addPts(2);$('fb').textContent='إجابة صحيحة'}else{b.classList.add('no');$('fb').textContent='الإجابة الصحيحة: '+q[1][q[2]]}
   var n=document.createElement('button');n.className='btn';n.textContent='متابعة';n.onclick=function(){S.qi++;quiz()};
   var d=document.createElement('div');d.className='row';d.style.justifyContent='flex-end';d.appendChild(n);P.appendChild(d)};
  $('os').appendChild(b)})}
reset();draw();
</script>
