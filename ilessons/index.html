<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14463a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>رحلة المعلوماتية | منصة التعلّم التفاعلي</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;background:#f4f6f5;color:#14231f;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif}
@media(prefers-color-scheme:dark){body{background:#0e1714;color:#e8f0ec}}
#boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#boot .sp{width:34px;height:34px;border-radius:50%;border:4px solid rgba(47,143,120,.25);border-top-color:#2f8f78;animation:sp .8s linear infinite}
#boot button{border:0;border-radius:12px;padding:10px 22px;background:#14463a;color:#fff;font:inherit;font-weight:700;cursor:pointer}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div id="boot"><div class="sp"></div><div>جارٍ التحميل…</div></div></div>
<noscript><p style="text-align:center;padding:24px">يلزم تفعيل JavaScript لتشغيل المنصة.</p></noscript>

<!--
  PERMANENT LOADER — you never need to edit this file again.
  To release an update: edit app.js / styles.css / students.js / config.js / lessons,
  then change the number in version.json (or run: python bump.py).
-->
<script>
var V='boot-1'; /* legacy-update marker for old cached copies: do not edit. Real version = version.json */
(function(){
  var KEY='ts_v',RK='ts_vr',loaded=null;

  function st(k,v){
    try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v) }catch(e){}
    return null;
  }

  /* always hits the network: no-store + unique query string (beats browser AND CDN caches) */
  function getVersion(){
    var ctl=window.AbortController?new AbortController():null;
    var t=ctl?setTimeout(function(){ctl.abort()},6000):0;
    return fetch('version.json?_='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json() })
      .then(function(j){ clearTimeout(t); if(!j||!j.v)throw new Error('bad version'); return String(j.v) },
            function(e){ clearTimeout(t); throw e });
  }

  function css(href){
    return new Promise(function(done){
      var l=document.createElement('link');
      l.rel='stylesheet';l.href=href;
      l.onload=l.onerror=function(){done()};
      document.head.appendChild(l);
      setTimeout(done,8000);
    });
  }
  function js(src){
    return new Promise(function(done,fail){
      var s=document.createElement('script');
      s.async=false; /* download in parallel, execute in insertion order */
      s.src=src;
      s.onload=function(){done()};
      s.onerror=function(){fail(new Error(src))};
      document.body.appendChild(s);
    });
  }

  function fail(){
    var b=document.getElementById('boot');
    if(!b)return;
    b.innerHTML='<div>⚠️ تعذّر تحميل المنصة. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.</div><button id="rl">إعادة المحاولة</button>';
    document.getElementById('rl').onclick=function(){location.reload()};
  }

  function start(v){
    loaded=v; V=v;
    var q='?v='+encodeURIComponent(v);
    css('styles.css'+q).then(function(){
      return Promise.all([js('students.js'+q),js('config.js'+q),js('app.js'+q)]);
    }).catch(fail);
    /* emoji library: optional, never blocks the app */
    var t=document.createElement('script');
    t.async=true;t.crossOrigin='anonymous';
    t.src='https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js';
    t.onload=function(){ if(window.twRun)window.twRun() };
    document.body.appendChild(t);
  }

  /* a student typing their name / watching a lesson is never interrupted */
  function busy(){
    if(window.view==='lesson')return true;
    var a=document.getElementById('ln'),b=document.getElementById('fn');
    return !!((a&&a.value)||(b&&b.value));
  }

  function check(){
    if(!loaded)return;
    getVersion().then(function(v){
      if(v===loaded)return;
      st(KEY,v);
      if(busy())return; /* retried on next focus / timer */
      var last=+st(RK)||0;
      if(Date.now()-last<20000)return; /* reload-loop guard */
      st(RK,String(Date.now()));
      location.reload();
    },function(){});
  }

  getVersion().then(function(v){ st(KEY,v); return v },function(){ return st(KEY)||V }).then(start);

  document.addEventListener('visibilitychange',function(){ if(!document.hidden)check() });
  window.addEventListener('online',check);
  window.addEventListener('pageshow',function(e){ if(e.persisted)check() });
  setInterval(check,300000);
})();
</script>
</body>
</html>
