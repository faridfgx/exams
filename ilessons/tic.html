<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5c4d">
<title>رحلة تكنولوجيا الإعلام والاتصال</title>
<style>
:root{--bg:#f4f6ff;--card:#fff;--tx:#1d2340;--mut:#5b6286;--pri:#5b4bff;--acc:#ff8a3d;--ok:#1fa971;--bad:#e5484d;--bd:#dfe3f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1c1f3d;--tx:#eef0ff;--mut:#a3a9d6;--pri:#8a7dff;--bd:#2d3160}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1c1f3d;--tx:#eef0ff;--mut:#a3a9d6;--pri:#8a7dff;--bd:#2d3160}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8}
header{text-align:center;padding:18px 14px 4px}
h1{margin:0;font-size:clamp(1.3rem,5vw,2rem)}
.pts{color:var(--mut)}.pts b{color:var(--acc)}
main{max-width:760px;margin:auto;padding:8px 14px 40px}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--acc));transition:width .6s}
.pc{font-size:.85rem;color:var(--mut);text-align:end}
.steps{display:flex;gap:6px;margin:12px 0}
.st{flex:1;font:inherit;font-size:.85rem;padding:8px 4px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--mut);cursor:pointer}
.st.cur{border-color:var(--pri);color:var(--tx);font-weight:700}
.st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.st.lock{opacity:.45;cursor:not-allowed}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:20px;min-height:280px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:var(--pri);color:#fff;border-radius:99px;padding:0 14px;font-size:.85rem}
.panel h2{margin:10px 0 6px}
.panel p{font-size:1.08rem;margin:6px 0}
.dots{display:flex;gap:5px;justify-content:center;margin:14px 0 4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--pri)}.dots i.cur{background:var(--acc);transform:scale(1.3)}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{font:inherit;border:0;border-radius:12px;padding:10px 22px;background:var(--pri);color:#fff;cursor:pointer}
.btn.g{background:var(--bd);color:var(--tx)}.btn[disabled]{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.big{text-align:center}.big h2{font-size:1.5rem}
.fb{min-height:1.6em;font-weight:700}
.ico{font-size:2.6rem;line-height:1.2}.ex{background:var(--bg);border:2px dashed var(--pri);border-radius:14px;padding:12px;margin:10px 0;font-size:.98rem}.ex .t{color:var(--mut);font-size:.85rem;margin:4px 0}.chips span{display:inline-block;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:2px 12px;margin:3px;font-weight:700}.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}.flow b{background:var(--pri);color:#fff;border-radius:10px;padding:4px 10px;font-size:.9rem}.res2{background:var(--ok);color:#fff;border-radius:12px;padding:10px;margin-top:8px;font-weight:700;animation:in .4s}
:root{--bg:#f7f4ee;--card:#fffdf9;--tx:#2a2622;--mut:#6f675d;--pri:#1f5c4d;--acc:#b5532a;--ok:#2f7d4f;--bad:#b3392f;--bd:#e3dccf}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1814;--card:#24211c;--tx:#efe9df;--mut:#b2a99a;--pri:#6fb59f;--bd:#3a352d}}
:root[data-theme="dark"]{--bg:#1a1814;--card:#24211c;--tx:#efe9df;--mut:#b2a99a;--pri:#6fb59f;--bd:#3a352d}
header{text-align:start;max-width:760px;margin:auto;padding:22px 14px 10px;border-bottom:1px solid var(--bd)}
h1{font-size:clamp(1.3rem,4.5vw,1.8rem)}
.bar{height:6px;border-radius:3px;margin-top:14px}.bar i{background:var(--pri);border-radius:3px}
.panel{border-radius:8px;border-width:1px;padding:24px}
.st,.btn,.opt{border-radius:6px}.st{border-width:1px}
.st.cur{border-color:var(--pri);border-width:2px}.btn{background:var(--pri)}.btn.g{background:var(--bd);color:var(--tx)}
.tag{background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:4px;padding:0 10px}
.ex{border:0;border-inline-start:4px solid var(--acc);border-radius:4px;background:var(--bg)}
.chips span{border-radius:6px;border-width:1px}.flow b{border-radius:6px}.res2{border-radius:6px}
.dots i{width:8px;height:8px}.dots i.cur{background:var(--acc)}

/* Responsive polish */
body{
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(ellipse at 8% 0%, color-mix(in srgb,var(--pri) 7%,transparent), transparent 34rem),
    var(--bg);
}
header{padding-top:clamp(18px,4vw,30px);padding-bottom:16px}
header h1{letter-spacing:-.025em;line-height:1.35}
.pts{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:.92rem}
.pts b{font-variant-numeric:tabular-nums;font-size:1.08rem}
main{width:min(100%,820px);padding:16px 18px 48px}
.bar{height:8px;background:color-mix(in srgb,var(--bd) 78%,transparent);border-radius:20px}
.bar i{border-radius:20px;transition:width .45s cubic-bezier(.2,.75,.25,1)}
.steps{
  gap:8px;
  padding:3px 1px 9px;
  overflow-x:auto;
  overscroll-behavior-inline:contain;
  scrollbar-width:thin;
  scrollbar-color:var(--bd) transparent;
}
.st{
  flex:0 0 auto;
  min-height:42px;
  padding:7px 13px;
  white-space:nowrap;
  transition:background .18s ease,border-color .18s ease,transform .18s ease,opacity .18s ease;
}
.st:not(.lock):active,.btn:active,.opt:active{transform:translateY(1px)}
.st:focus-visible,.btn:focus-visible,.opt:focus-visible{
  outline:3px solid color-mix(in srgb,var(--acc) 65%,transparent);
  outline-offset:3px;
}
.panel{
  min-height:300px;
  padding:clamp(18px,4vw,30px);
  border-radius:14px;
  box-shadow:0 12px 34px rgba(35,32,25,.055);
}
.panel h2{line-height:1.45;letter-spacing:-.015em}
.panel p{line-height:1.9}
.tag{font-weight:700;letter-spacing:.01em}
.btn,.opt,.st{touch-action:manipulation}
.btn{min-height:44px;padding:9px 19px;font-weight:650;transition:filter .18s ease,transform .18s ease}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn.g{border:1px solid var(--bd)}
.opt{
  min-height:48px;
  padding:11px 14px;
  line-height:1.65;
  transition:border-color .18s ease,background .18s ease,transform .18s ease;
}
.opt:not(:disabled):hover{border-color:var(--pri)}
.fb{margin-top:12px}
.row{align-items:center}
.ex{line-height:1.8}
.chips span{margin:4px 3px}
.res2{box-shadow:0 5px 16px rgba(47,125,79,.12)}
.big{padding:12px 2px}
.big h2{line-height:1.5}
.level-success{animation:levelComplete .55s ease-out both}
.level-success .tag{animation:tagSettle .45s .08s ease-out both}
@keyframes levelComplete{
  0%{transform:scale(.992);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 0%,transparent)}
  55%{transform:scale(1.006);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 13%,transparent)}
  100%{transform:scale(1);box-shadow:0 12px 34px rgba(35,32,25,.055)}
}
@keyframes tagSettle{0%{transform:translateY(4px);opacity:.65}100%{transform:translateY(0);opacity:1}}
@media(max-width:600px){
  header{padding:17px 16px 12px}
  header h1{font-size:1.35rem}
  main{padding:12px 12px 30px}
  .steps{margin:10px -2px 14px;gap:7px}
  .st{font-size:.82rem;padding:7px 11px;min-height:40px}
  .panel{min-height:260px;padding:18px 15px}
  .panel p{font-size:1rem}
  .row{gap:8px}
  .row .btn{flex:1;padding-inline:10px}
  .opt{font-size:.96rem}
  .flow{gap:5px}
  .flow b{font-size:.82rem}
  .ex{padding:10px}
}
@media(max-width:380px){
  header h1{font-size:1.2rem}
  .panel{padding:15px 12px}
  .row{flex-wrap:wrap}
  .row .btn{min-width:calc(50% - 5px)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* Mobile step navigation: same wrapping behaviour as sec.html */
@media(max-width:600px){
  .steps{flex-wrap:wrap;gap:6px}
  .st{flex:1 1 calc(50% - 6px);min-width:0;min-height:44px;white-space:normal;touch-action:manipulation}
}
@media(max-width:360px){
  .st{flex-basis:100%}
}
</style>
</head>

'0-4':'<div class="t">مثال</div>برنامج يحسب معدلات التلاميذ آليا في ثوان بدل الحساب باليد.',
'0-5':'<div class="t">مثال: الأستاذ يشرح الدرس</div><div class="flow"><b>المرسل: الأستاذ</b><span>←</span><b>الرسالة: الدرس</b><span>←</span><b>المستقبل: التلميذ</b></div>',
'0-6':'<div class="t">مثال</div>نشرة الأخبار تخبر المشاهدين بما حدث اليوم، فهي تقدم المعلومات من المرسل إلى المستقبل.',
'0-7':'<div class="t">مثال: عناصر تجتمع في مكالمة فيديو</div><div class="chips"><span>حاسوب</span><span>برنامج</span><span>إنترنت</span><span>كاميرا</span></div>',
'0-8':'<div class="t">أمثلة</div><div class="chips"><span>الصحة</span><span>التجارة الإلكترونية</span><span>النقل</span><span>البورصة</span><span>التعليم</span><span>الجيش</span></div>'
};
var S={lv:0,it:0,stage:'learn',qi:0,sc:0,max:0,done:{},seen:{},pts:0};
var KEY='tic-progress-v2';
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){S.max=sv.max||0;S.done=sv.done||{};S.pts=sv.pts||0;S.lv=Math.min(S.max,L.length-1)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({max:S.max,done:S.done,pts:S.pts}))}catch(e){}}
function $(i){return document.getElementById(i)}
function sh(a){return a.map(function(x,i){return [Math.random(),i]}).sort(function(a,b){return a[0]-b[0]})}
function renderTop(){
 var n=Object.keys(S.done).length,p=Math.round(n/L.length*100);
 $('bar').style.width=p+'%';$('pc').textContent='أنهيت '+n+' من '+L.length+' مستويات';$('pts').textContent=S.pts;
 var h='';L.forEach(function(l,i){var c=S.done[i]?'done':i===S.lv?'cur':i>S.max?'lock':'';
  h+='<button class="st '+c+'" data-i="'+i+'">'+(i+1)+'. '+l.n+(S.done[i]?' ✓':'')+'</button>'});
 $('steps').innerHTML=h}
$('steps').onclick=function(e){var i=e.target.dataset&&e.target.dataset.i;if(i===undefined||+i>S.max)return;
 S.lv=+i;S.it=0;S.qi=0;S.sc=0;S.stage=L[S.lv].items.length?'learn':'quiz';draw()};
function draw(){
 renderTop();var l=L[S.lv],P=$('panel'),h='';
 P.style.animation='none';P.offsetHeight;P.style.animation='';
 if(S.stage==='learn'){
  var it=l.items[S.it];
  var ex=EX[S.lv+'-'+S.it];h='<span class="tag">'+it[0]+'</span><h2>'+it[1]+'</h2><p>'+it[2]+'</p>'+(ex?'<div class="ex">'+ex+'</div>':'')+'<div class="dots">';
  l.items.forEach(function(x,i){h+='<i class="'+(i===S.it?'cur':i<S.it?'on':'')+'"></i>'});
  h+='</div><div class="pc" style="text-align:center">'+(S.it+1)+' من '+l.items.length+'</div><div class="row"><button class="btn g" id="pv"'+(S.it?'':' disabled')+'>السابق</button><button class="btn" id="nx">'+(S.it===l.items.length-1?'ابدأ اختبار المستوى':'فهمت، التالي')+'</button></div>';
  P.innerHTML=h;
  var k=S.lv+'-'+S.it;if(!S.seen[k]&&!S.done[S.lv]){S.seen[k]=1;S.pts++;$('pts').textContent=S.pts}
  $('pv').onclick=function(){S.it--;draw()};
  $('nx').onclick=function(){if(S.it<l.items.length-1)S.it++;else{S.stage='quiz';S.qi=0;S.sc=0}draw()};
 }else{quiz()}}
function quiz(){
 var l=L[S.lv],q=l.q[S.qi],P=$('panel');
 if(!q){var need=l.q.length-1,ok=S.sc>=need;
  if(ok){var first=!S.done[S.lv];S.done[S.lv]=1;if(first)S.pts+=5;if(S.max<L.length-1&&S.max===S.lv)S.max++;save();renderTop()}
  var last=S.lv===L.length-1;
  P.innerHTML='<div class="big"><h2>'+(ok?(last?'أحسنت! أكملت الرحلة':'أحسنت! أنهيت المستوى '+(S.lv+1)):'اقتربت من النجاح')+'</h2><p>نتيجتك: '+S.sc+' من '+l.q.length+'</p><p>'+(ok?(last?'مجموع نقاطك: '+S.pts+'. أنت الآن تعرف أساسيات TIC.':'تم فتح المستوى التالي: '+L[S.lv+1].n):'تحتاج '+need+' إجابات صحيحة على الأقل. راجع الدرس ثم أعد المحاولة.')+'</p><div class="row" style="justify-content:center">'+(ok&&!last?'<button class="btn" id="go">المستوى التالي</button>':'')+(ok?'':'<button class="btn g" id="rv">مراجعة الدرس</button>')+'<button class="btn g" id="rt">إعادة الاختبار</button></div></div>';
  if(ok){P.classList.add('level-success')}
   if($('go'))$('go').onclick=function(){S.lv++;S.it=0;S.qi=0;S.sc=0;S.stage=L[S.lv].items.length?'learn':'quiz';draw()};
  if($('rv'))$('rv').onclick=function(){S.it=0;S.stage='learn';draw()};
  $('rt').onclick=function(){S.qi=0;S.sc=0;draw()};return}
 P.innerHTML='<span class="tag">اختبار المستوى</span><p><b>السؤال '+(S.qi+1)+' من '+l.q.length+'</b></p><h2 style="font-size:1.15rem">'+q[0]+'</h2><div id="os"></div><div class="fb" id="fb"></div>';
 sh(q[1]).forEach(function(r){var i=r[1],b=document.createElement('button');b.className='opt';b.textContent=q[1][i];
  b.onclick=function(){var all=$('os').children;
   for(var j=0;j<all.length;j++){all[j].disabled=true;if(all[j].textContent===q[1][q[2]])all[j].classList.add('ok')}
   if(i===q[2]){S.sc++;if(!S.done[S.lv]){S.pts+=2}$('fb').textContent='إجابة صحيحة'}
   else{b.classList.add('no');$('fb').textContent='الإجابة الصحيحة: '+q[1][q[2]]}
   $('pts').textContent=S.pts;
   var n=document.createElement('button');n.className='btn';n.textContent='متابعة';n.onclick=function(){S.qi++;quiz()};
   var d=document.createElement('div');d.className='row';d.style.justifyContent='flex-end';d.appendChild(n);P.appendChild(d)};
  $('os').appendChild(b)})}
S.stage=L[S.lv].items.length?'learn':'quiz';
draw();
</script>
</body>
</html>
